name: PayGo CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
# Permisos necesarios para que CodeQL suba el análisis de seguridad
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  # ----------------------------------------------------------------------------
  # ETAPA 1: BUILD (Compilación del proyecto)
  # ----------------------------------------------------------------------------
  build:
    name: 1. Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4

      - name: Configurar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restaurar dependencias
        run: dotnet restore

      - name: Compilar proyecto PayGo
        run: dotnet build --no-restore --configuration Release

  # ----------------------------------------------------------------------------
  # ETAPA 2: TEST (Pruebas automatizadas)
  # ----------------------------------------------------------------------------
  test:
    name: 2. Run Automated Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4

      - name: Configurar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Ejecutar pruebas unitarias
        run: dotnet test --configuration Release --verbosity normal

  # ----------------------------------------------------------------------------
  # ETAPA 3: SECURITY SCAN (Análisis de vulnerabilidades y seguridad)
  # ----------------------------------------------------------------------------
  security-scan:
    name: 3. Security & Dependency Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4

      - name: Configurar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Auditar vulnerabilidades en dependencias
        run: dotnet list package --vulnerable --include-transitive

      - name: Inicializar análisis de seguridad CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Compilar para análisis CodeQL
        run: dotnet build --configuration Release

      - name: Finalizar y reportar hallazgos de seguridad
        uses: github/codeql-action/analyze@v3

  # ----------------------------------------------------------------------------
  # ETAPA 4: DEPLOY (Empaquetado y despliegue)
  # ----------------------------------------------------------------------------
  deploy:
    name: 4. Deploy to Production
    runs-on: ubuntu-latest
    needs: security-scan
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'

    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4

      - name: Configurar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publicar artefactos de PayGo
        run: dotnet publish -c Release -o ./publish

      - name: Subir artefacto de despliegue
        uses: actions/upload-artifact@v4
        with:
          name: paygo-release-package
          path: ./publish

      - name: Desplegar en entorno de producción
        run: |
          echo "Iniciando despliegue de PayGo Gateway..."
          echo "Despliegue completado exitosamente en el servidor de producción."
